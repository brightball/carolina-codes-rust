[package]
name = "carolina-codes-rust"
version = "0.2.0"
edition = "2021"
description = "Read-only v1 polyglot API for Carolina Code Conference"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
axum = "0.8"
deadpool-postgres = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time"] }
tokio-postgres = "0.7"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
